<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6; --panel: #ffffff; --text: #1f1e1c; --muted: #6b6862;
    --line: #e6e3dc; --accent: #c96442; --accent-text: #ffffff;
    --user: #f1ede4; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b19; --panel: #252422; --text: #ecebe7; --muted: #a29f98;
      --line: #3a3835; --accent: #d97757; --user: #34322e; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 16px/1.65 "IBM Plex Sans Thai", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header small { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--text); padding: 6px 12px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user {
    align-self: flex-end; background: var(--user); padding: 10px 14px;
    border-radius: 16px 16px 4px 16px; max-width: 85%;
  }
  .msg.bot { align-self: stretch; }
  .status { color: var(--muted); font-size: 14px; }
  .error { color: var(--error); font-size: 14px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .empty b { display: block; color: var(--text); font-size: 22px; margin-bottom: 6px; }
  form {
    border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px;
  }
  form .wrap { flex-direction: row; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    max-height: 180px; min-height: 46px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: var(--accent-text); border: none; padding: 11px 18px; }
</style>
</head>
<body>
<header>
  <div><h1>Claude Chat</h1><small>{{ model }} · ค้นเว็บ · พยากรณ์อากาศ · เวลา</small></div>
  <button id="reset" type="button">เริ่มใหม่</button>
</header>

<main id="log"><div class="wrap" id="msgs">
  <div class="empty" id="empty"><b>สวัสดีครับ 👋</b>ลองถาม เช่น “อากาศเชียงใหม่ตอนนี้เป็นไง” หรือ “ข่าวเทคโนโลยีล่าสุดวันนี้”</div>
</div></main>

<form id="form">
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="พิมพ์ข้อความ... (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)" autofocus></textarea>
    <button id="send" type="submit">ส่ง</button>
  </div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), msgs = $("msgs"), input = $("input"), send = $("send");
let sessionId = crypto.randomUUID();
let busy = false;

function add(cls, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  msgs.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setBusy(v) { busy = v; send.disabled = v; $("reset").disabled = v; }

async function sendMessage(text) {
  setBusy(true);
  add("msg user", text);
  let bot = add("msg bot", "");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      add("error", err.error || `เกิดข้อผิดพลาด (${res.status})`);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") {
          bot.textContent += ev.text;
        } else if (ev.type === "status") {
          add("status", ev.text);
          bot = add("msg bot", "");  // ข้อความต่อจากนี้อยู่ใต้สถานะ
        } else if (ev.type === "error") {
          add("error", ev.text);
        }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) {
    add("error", "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: " + e.message);
  } finally {
    msgs.querySelectorAll(".msg.bot").forEach((el) => { if (!el.textContent.trim()) el.remove(); });
    setBusy(false);
    input.focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; input.style.height = "";
  sendMessage(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});

$("reset").addEventListener("click", async () => {
  await fetch("/api/reset", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId }),
  }).catch(() => {});
  sessionId = crypto.randomUUID();
  msgs.innerHTML = '<div class="empty" id="empty"><b>เริ่มบทสนทนาใหม่</b>พิมพ์คำถามได้เลย</div>';
  input.focus();
});
</script>
</body>
</html>
