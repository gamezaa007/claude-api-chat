<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="claude-api-chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/><stop offset="0.6" stop-color="#1E1B4B"/><stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.45"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#A5B4FC" fill-opacity="0.18"/></pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle cx="980" cy="120" r="300" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -120 30; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14">
      <circle cx="30" cy="30" r="5" fill="#F87171"/><circle cx="48" cy="30" r="5" fill="#FBBF24"/><circle cx="66" cy="30" r="5" fill="#34D399"/>
      <text x="86" y="35" fill="#94A3B8">gamezaa007 / <tspan fill="#E2E8F0">claude-api-chat</tspan><tspan fill="#F472B6"> ▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
    <text x="60" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Thai', sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">claude-api-chat</text>
    <text x="60" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Thai', sans-serif" font-size="22" fill="#CBD5E1">Chat with Claude in your terminal or browser</text>
    <g transform="translate(60 196)"><rect width="80" height="30" rx="15" fill="#0B1026" fill-opacity="0.6" stroke="#F472B6" stroke-opacity="0.55"/><text x="40" y="20" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#E2E8F0">Python</text></g>
    <g transform="translate(149.6 196)"><rect width="71" height="30" rx="15" fill="#0B1026" fill-opacity="0.6" stroke="#F472B6" stroke-opacity="0.55"/><text x="36" y="20" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#E2E8F0">Flask</text></g>
    <g transform="translate(230.6 196)"><rect width="140" height="30" rx="15" fill="#0B1026" fill-opacity="0.6" stroke="#F472B6" stroke-opacity="0.55"/><text x="70" y="20" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#E2E8F0">Anthropic SDK</text></g>
    <g transform="translate(380.4 196)"><rect width="105" height="30" rx="15" fill="#0B1026" fill-opacity="0.6" stroke="#F472B6" stroke-opacity="0.55"/><text x="53" y="20" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#E2E8F0">Streaming</text></g>
    <g transform="translate(495.79999999999995 196)"><rect width="97" height="30" rx="15" fill="#0B1026" fill-opacity="0.6" stroke="#F472B6" stroke-opacity="0.55"/><text x="48" y="20" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#E2E8F0">Tool Use</text></g>
    <g stroke="#F472B6" stroke-opacity="0.5" stroke-width="2" fill="none">
      <path id="w" d="M900 230 L1010 170 L1120 205 L1170 120"/>
    </g>
    <g fill="#0B1026" stroke="#F472B6" stroke-width="2.5">
      <circle cx="900" cy="230" r="7"/><circle cx="1010" cy="170" r="7"/><circle cx="1120" cy="205" r="7"/><circle cx="1170" cy="120" r="7"/>
    </g>
    <circle r="4.5" fill="#F472B6"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#w"/></animateMotion></circle>
    <circle r="4.5" fill="#34D399"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite"><mpath href="#w"/></animateMotion></circle>
  </g>
</svg>
